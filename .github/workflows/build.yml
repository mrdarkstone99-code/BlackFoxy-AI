name: CI

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            pkg-config \
            autoconf \
            libtool

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install "cython<3.0"
          pip install buildozer virtualenv

      - name: Generate buildozer.spec
        run: |
          cat > buildozer.spec << EOF
          [app]
          title = BlackFoxy AI
          package.name = blackfoxy
          package.domain = org.foxy
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0

          requirements = python3,kivy==2.3.0,kivymd==1.2.0,pillow

          orientation = portrait
          fullscreen = 1

          android.archs = arm64-v8a
          android.api = 33
          android.minapi = 24

          [buildozer]
          log_level = 2
          EOF

      - name: Automate Buildozer Dependencies and Build
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          SKIP_JDK_VERSION_CHECK: "true"
          GRADLE_OPTS: "-Dorg.gradle.project.android.builder.sdkDownload=true"
        run: |
          # 1. Pre-populate default license directory structures natively
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # 2. Inject license hashes directly into the build environment cache
          printf "24333f8a63b6825ea1c5573490f22d18672203a0\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "8493401003b56243d2047d6165fb10faea9742c5\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          printf "d974f761403f24cb56e45e516c88a42f1414e0a2\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # 3. Clean compilation run
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackFoxy-AI-APK
          path: bin/*.apk
