name: CI

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Global Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            pkg-config \
            autoconf \
            libtool

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install "cython<3.0"
          pip install buildozer virtualenv

      - name: Generate buildozer.spec
        run: |
          cat > buildozer.spec << EOF
          [app]
          title = BlackFoxy AI
          package.name = blackfoxy
          package.domain = org.foxy
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0

          requirements = python3,kivy==2.3.0,kivymd==1.2.0,pillow

          orientation = portrait
          fullscreen = 1

          android.archs = arm64-v8a
          android.api = 33
          android.minapi = 24

          [buildozer]
          log_level = 2
          EOF

      - name: Sync Licenses and Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          SKIP_JDK_VERSION_CHECK: "true"
        run: |
          # 1. Pre-create Buildozer's expected internal license directory
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # 2. Copy the officially accepted global licenses directly into Buildozer's workspace path
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/
          fi

          # 3. Clean execution without interactive piping over structural paths
          buildozer android debug --sdk_path=$ANDROID_HOME

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackFoxy-AI-APK
          path: bin/*.apk
