name: CI
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            lld \
            bsdmainutils \
            python3-setuptools \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" virtualenv buildozer

      - name: Auto-Generate Clean Buildozer Spec
        run: |
          rm -f buildozer.spec
          cat << 'EOF' > buildozer.spec
          [app]
          title = BlackFoxy AI
          package.name = blackfoxy
          package.domain = org.foxy
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = hostpython3,python3,kivy==2.3.0,kivymd==1.2.0,pillow
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          EOF

      - name: Pre-Accept Android Licenses and Build
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle
        run: |
          mkdir -p ~/.buildozer
          yes | sdkmanager --licenses || true
          buildozer android debug
